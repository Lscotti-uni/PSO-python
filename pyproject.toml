[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pso-lab"
version = "1.0.0"
description = "Particle Swarm Optimization laboratory with parallel evaluation strategies."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Luca" }]
dependencies = [
    "gradio>=4.44",
    "joblib>=1.4",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "Pillow>=10.0",
    "prettytable>=3.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
