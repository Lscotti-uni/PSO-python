search_name: full_grid_pso
output_dir: results/grid_search
runs_output_dir: results/runs
objective: sphere
bounds: [-5.12, 5.12]
dimensions: [10]
seeds: [11, 23, 37, 47, 59]
metric: mean_best_value
defaults:
  swarm_size: 40
  iterations: 150
  boundary_strategy: clamp
  topology: global
  tolerance: 1.0e-8  # Used only to report convergence_iteration; early stopping is disabled here.
  enable_early_stopping: false  # Grid-search candidates use the same iteration budget for comparability.
  velocity_clamp: 0.20
  log_every: 9999
strategies:
  V0:
    strategy: sequential
    batch_size: 1
  V1:
    strategy: thread
    workers: 4
    batch_size: 1
  V2:
    strategy: process
    workers: 4
    batch_size: 8
  V3:
    strategy: async
    workers: 4
    batch_size: 4
  V4:
    strategy: vectorized
    batch_size: 1
    update_mode: vectorized
  V5:
    strategy: joblib
    workers: 4
    batch_size: 8
    joblib_backend: loky
# Experimental protocol: 3x3x3 grid over w/c1/c2 with 5 seeds per strategy.
# swarm_size and iterations stay fixed (see defaults above) so the 27
# candidates only differ along the inertia/cognitive/social subspace.
search_space:
  inertia: [0.50, 0.7298, 0.90]
  cognitive: [1.20, 1.49618, 1.80]
  social: [1.20, 1.49618, 1.80]
