search_name: reduced_grid
output_dir: results/grid_search
objective: sphere
dimensions: [10, 30]
seeds: [11, 23, 37, 47, 59]
metric: mean_best_value
defaults:
  boundary_strategy: clamp
  topology: global
  neighborhood_size: 3
  tolerance: 1.0e-8
  stagnation_iters: 60
  velocity_clamp: 0.20
  joblib_backend: loky
  log_every: 9999
strategy:
  strategy: vectorized
  update_mode: vectorized
  batch_size: 64
search_space:
  inertia: [0.50, 0.7298, 0.90]
  cognitive: [1.20, 1.49618, 1.80]
  social: [1.20, 1.49618, 1.80]
  swarm_size: [30, 40, 60]
  iterations: [150]
  topology: [global, ring]
