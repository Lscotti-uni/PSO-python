protocol_name: pso_full_protocol
output_root: results/protocol_full
benchmark_config: configs/benchmark_suite_full.yaml
grid_search_config: configs/grid_search_protocol.yaml
grid_search_strategies:
  V0:
    strategy: sequential
    update_mode: loop
    batch_size: 1
  V1:
    strategy: thread
    update_mode: loop
    batch_size: 1
    workers: 4
  V2:
    strategy: process
    update_mode: loop
    batch_size: 8
    workers: 4
  V3:
    strategy: asyncio
    update_mode: loop
    batch_size: 1
    async_latency_ms: 2.0
    async_jitter_ms: 1.0
  V4:
    strategy: vectorized
    update_mode: vectorized
    batch_size: 40
  V5:
    strategy: joblib
    update_mode: loop
    batch_size: 8
    workers: 4
report_path: docs/final_report.md
